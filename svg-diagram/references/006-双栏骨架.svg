<?xml version="1.0" encoding="UTF-8"?>
<!--
  分区全景骨架 · 1960 宽（模式 B：读者会点开看大图）
  用途：任一领域的对象全景，双栏分区 + 区块容器 + 三行卡片
  示例按「系统 / 服务」语境填充；换成机房就填 IP，换成组织就填部门，
  换成项目就填交付物——结构与配色不变，只换文字。
  替换方法：所有【】为占位符；左右分区结构与区块 y 坐标必须一致，卡片内容可不同
  坐标基准：分区 x=20 / 1020，区块 x=分区.x+20，卡片 x=区块.x+15，pitch=289
  分区副标题：x = 标题.x + 标题估算宽 + 12。本骨架按 4 字标题算得 x=155，标题变长要同步后移。
  emoji 在 cairosvg 下渲染为方块，属预期；浏览器正常显示，验收以浏览器为准。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1960 930"
     font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">

  <rect x="0" y="0" width="1960" height="930" fill="#ffffff"/>

  <defs>
    <!-- 线宽 2 的主箭头（10×10） -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
    <!-- 线宽 3 的双向互联（12×12） -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
    <!-- 橙色失败路径（10×10） -->
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e65100"/>
    </marker>
    <!-- 细线（线宽 ≤1.5）用的小箭头（7×7） -->
    <marker id="arrowSm" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
  </defs>

  <!-- ========== 标题区 ========== -->
  <text x="30" y="44" font-size="20" font-weight="bold" fill="#1b5e20">【全景标题】· 【视角】</text>
  <text x="30" y="68" font-size="12" fill="#616161">数据来源：【来源表 / 文档】，并经【复核人】于【YYYY-MM-DD】复核</text>

  <!-- ========== 外部实体（胶囊，居中） ========== -->
