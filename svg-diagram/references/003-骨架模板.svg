<!--
  骨架模板：双栏分区全景图
  用法：复制本文件 → 改标题/数据来源 → 按需增删卡片 → 重算容器高与画布高 → 补图例
  坐标已按 002-布局与坐标.md 的推荐值排好，改内容时记得同步改容器 height
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1960 1185" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="1960" height="1185" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e65100"/>
    </marker>
  </defs>

  <!-- ===== 标题 ===== -->
  <text x="30" y="44" font-size="20" font-weight="bold" fill="#1b5e20">【图名】</text>
  <text x="30" y="68" font-size="12" fill="#616161">数据来源：【来源表/文档】（截至 YYYY-MM-DD）</text>

  <!-- ===== 外部节点（胶囊形） ===== -->
  <rect x="680" y="20" width="600" height="60" rx="30" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
  <text x="980" y="57" font-size="17" font-weight="bold" fill="#37474f" text-anchor="middle">🌐 互联网</text>
  <line x1="840" y1="80" x2="680" y2="139" stroke="#607d8b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1120" y1="80" x2="1280" y2="139" stroke="#607d8b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ===== 分区间互联（已确认用蓝实线双向） ===== -->
  <text x="980" y="522" font-size="11" font-weight="bold" fill="#1565c0" text-anchor="middle">分区间</text>
  <text x="980" y="537" font-size="11" font-weight="bold" fill="#1565c0" text-anchor="middle">VPN 互联</text>
  <line x1="944" y1="552" x2="1016" y2="552" stroke="#1565c0" stroke-width="3" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>

  <!-- ==================== 左分区 ==================== -->
  <rect x="20" y="140" width="920" height="820" rx="12" fill="#f1f8e9" fill-opacity="0.55" stroke="#2e7d32" stroke-width="2"/>
  <text x="40" y="170" font-size="17" font-weight="bold" fill="#1b5e20">🏢 【左分区名】</text>
  <text x="168" y="170" font-size="11.5" fill="#4e6b50">【范围概述】</text>

  <!-- A 区块：3 张大卡片（w=272 pitch=289） -->
  <rect x="40" y="185" width="880" height="140" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="56" y="210" font-size="14" font-weight="bold" fill="#0d47a1">🔥 【区块标题】</text>
  <g text-anchor="middle">
    <rect x="55" y="228" width="272" height="82" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
    <text x="191" y="258" font-size="15" font-weight="bold" fill="#0d2f5c">【主文字】</text>
    <text x="191" y="279" font-size="11.5" fill="#37474f">【次文字】</text>
    <text x="191" y="297" font-size="11.5" fill="#37474f">【第三行】</text>

    <rect x="344" y="228" width="272" height="82" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
    <text x="480" y="258" font-size="15" font-weight="bold" fill="#0d2f5c">【主文字】</text>
    <text x="480" y="279" font-size="11.5" fill="#37474f">【次文字】</text>

    <rect x="633" y="228" width="272" height="82" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
    <text x="769" y="258" font-size="15" font-weight="bold" fill="#0d2f5c">【主文字】</text>
    <text x="769" y="279" font-size="11.5" fill="#37474f">【次文字】</text>
  </g>

  <!-- B 区块：左右映射关系（窄卡 → 箭头 → 宽卡） -->
  <rect x="40" y="345" width="880" height="150" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="56" y="370" font-size="14" font-weight="bold" fill="#0d47a1">🌍 【映射区块标题】</text>
  <g>
    <rect x="55" y="380" width="240" height="34" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
    <text x="175" y="402" font-size="13" font-weight="bold" fill="#0d2f5c" text-anchor="middle">【来源】</text>
    <line x1="300" y1="397" x2="328" y2="397" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="335" y="380" width="570" height="34" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="350" y="402" font-size="12.5" fill="#1b3d1e">【目标 · 说明】</text>
  </g>

  <!-- C 区块：网段卡片（w=160 pitch=172）+ 空置虚线框 -->
  <rect x="40" y="520" width="880" height="255" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="56" y="545" font-size="14" font-weight="bold" fill="#1b5e20">🖥️ 【网段区块标题】</text>
  <g text-anchor="middle">
    <rect x="55" y="557" width="160" height="68" rx="6" fill="#a5d6a7" stroke="#1b5e20" stroke-width="2"/>
    <text x="135" y="581" font-size="12.5" font-weight="bold" fill="#123314">【主力网段】</text>
    <text x="135" y="600" font-size="11" fill="#1b5e20">【数量 · 主力段】</text>
    <text x="135" y="618" font-size="10" fill="#2e5230">【承载业务】</text>

    <rect x="227" y="557" width="160" height="68" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="307" y="581" font-size="12.5" font-weight="bold" fill="#1b3d1e">【普通网段】</text>
    <text x="307" y="600" font-size="11" fill="#37474f">【数量】</text>
    <text x="307" y="618" font-size="10" fill="#546e7a">【用途】</text>

    <rect x="399" y="557" width="160" height="68" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2.5"/>
    <text x="479" y="581" font-size="12.5" font-weight="bold" fill="#7f3f00">【特殊网段】</text>
    <text x="479" y="600" font-size="11" fill="#7f3f00">【关键 IP】</text>
    <text x="479" y="618" font-size="10" font-weight="bold" fill="#c62828">★ 【特殊说明】</text>
  </g>
  <!-- 空置网段：小卡片 w=86 pitch=93，装不下就换行（y+38） -->
  <rect x="55" y="640" width="850" height="76" rx="6" fill="#fafafa" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="65" y="659" font-size="11.5" fill="#757575">空置网段（无实际业务，IP 均为网关 / 广播地址 / IDRAC 地址 / 交换机）</text>
  <g text-anchor="middle" font-size="9.5" fill="#757575">
    <rect x="65" y="668" width="86" height="34" rx="4" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1"/><text x="108" y="689">【网段】</text>
    <rect x="158" y="668" width="86" height="34" rx="4" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1"/><text x="201" y="689">【网段】</text>
    <rect x="251" y="668" width="86" height="34" rx="4" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1"/><text x="294" y="689">【网段】</text>
  </g>
  <text x="55" y="740" font-size="11.5" fill="#37474f">· 【汇总说明】</text>
  <text x="55" y="761" font-size="11.5" fill="#c62828">★ 【重点说明】</text>

  <!-- D 区块：管理网段 -->
  <rect x="40" y="795" width="880" height="145" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="56" y="820" font-size="14" font-weight="bold" fill="#8d6e00">⚙️ 管理网段（非 P0）</text>
  <g text-anchor="middle">
    <rect x="60" y="833" width="250" height="64" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
    <text x="185" y="859" font-size="13" font-weight="bold" fill="#5d4700">【网段】</text>
    <text x="185" y="879" font-size="11" fill="#5d4700">【用途 · 数量】</text>
    <rect x="330" y="833" width="250" height="64" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
    <text x="455" y="859" font-size="13" font-weight="bold" fill="#5d4700">【网段】</text>
    <text x="455" y="879" font-size="11" fill="#5d4700">【用途 · 数量】</text>
  </g>
  <text x="60" y="923" font-size="11.5" fill="#37474f">· 【说明】</text>

  <!-- ==================== 右分区（与左分区对称，x 偏移 +1000） ==================== -->
  <rect x="1020" y="140" width="920" height="820" rx="12" fill="#f1f8e9" fill-opacity="0.55" stroke="#2e7d32" stroke-width="2"/>
  <text x="1040" y="170" font-size="17" font-weight="bold" fill="#1b5e20">🏢 【右分区名】</text>
  <text x="1180" y="170" font-size="11.5" fill="#4e6b50">【范围概述】</text>
  <!-- 内部区块结构同左分区，所有 x 加 1000 -->

  <!-- ===== 底部汇总块 ===== -->
  <line x1="480" y1="980" x2="480" y2="962" stroke="#e65100" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowOrange)"/>
  <text x="492" y="975" font-size="10" fill="#e65100">【左分区全部网段】</text>
  <line x1="1400" y1="980" x2="1400" y2="962" stroke="#e65100" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowOrange)"/>
  <text x="1412" y="975" font-size="10" fill="#e65100">【右分区全部网段】</text>

  <rect x="20" y="980" width="1150" height="100" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="40" y="1010" font-size="15" font-weight="bold" fill="#bf360c">🛰 【核心结论标题】</text>
  <text x="40" y="1036" font-size="12.5" fill="#5d4037">· 【要点一】</text>
  <text x="40" y="1060" font-size="12.5" fill="#5d4037">· 【要点二】</text>

  <rect x="1190" y="980" width="750" height="100" rx="8" fill="#fff8e1" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="1210" y="1010" font-size="15" font-weight="bold" fill="#e65100">★ 【次要结论标题】</text>
  <text x="1210" y="1038" font-size="12.5" fill="#5d4037">· 【要点一】</text>
  <text x="1210" y="1062" font-size="12.5" fill="#5d4037">· 【要点二】</text>

  <!-- ===== 图例（必须与图上实际元素一一对应） ===== -->
  <rect x="20" y="1100" width="1920" height="65" rx="8" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <g font-size="12.5" fill="#37474f">
    <rect x="40" y="1115" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="72" y="1126">服务器网段（P0 · 在用）</text>
    <rect x="330" y="1115" width="22" height="14" rx="3" fill="#a5d6a7" stroke="#1b5e20" stroke-width="2"/>
    <text x="362" y="1126">主力网段</text>
    <rect x="620" y="1115" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="2.5"/>
    <text x="652" y="1126">枢纽 / 特殊网段</text>
    <rect x="910" y="1115" width="22" height="14" rx="3" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="942" y="1126">空置网段（网关 / 广播 / IDRAC / 交换机）</text>

    <rect x="40" y="1141" width="22" height="14" rx="3" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
    <text x="72" y="1152">容器网段</text>
    <rect x="330" y="1141" width="22" height="14" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
    <text x="362" y="1152">管理网段（非 P0）</text>
    <rect x="620" y="1141" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
    <text x="652" y="1152">公网 IP（入口 / 出口）</text>
    <line x1="910" y1="1148" x2="944" y2="1148" stroke="#1565c0" stroke-width="3"/>
    <text x="952" y="1152">分区间 VPN 互联</text>
    <line x1="1190" y1="1148" x2="1224" y2="1148" stroke="#e65100" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="1232" y="1152">枢纽的可达范围</text>
  </g>
</svg>
