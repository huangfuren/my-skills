<!--
  骨架模板：纵向分层架构图（文档内嵌默认形态）
  画布 1200 宽，嵌进技术文档正文后字号仍在可读区（见 001-视觉规范.md 第一节）
  用法：复制 → 改标题与数据来源 → 按需增删层与卡片 → 重算层高与画布高 → 对齐图例

  坐标要点（改内容时同步维护）：
    画布     1200 × 902
    内容区    x=30 起，宽 1140，左右页边距各 30
    层底板    高 140（标题 26 + 卡片 76 + 底部留白）
    层间距    36（放层间箭头）
    卡片      3 张等宽，w=358、间隙 17、pitch=375、起点 x=46
              验算：46 + 2×375 + 358 = 1154，底板右 1170，左右内边距各 16 ✓

  双栏全景（左右两个分区对比）见 006-双栏骨架.svg，不要套本骨架
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 902" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <rect x="0" y="0" width="1200" height="902" fill="#ffffff"/>

  <defs>
    <!-- 线宽 2 的主箭头（10×10） -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
    <!-- 线宽 3 的双向互联（12×12） -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
    <!-- 橙色失败路径（10×10） -->
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e65100"/>
    </marker>
    <!-- 细线（线宽 ≤1.5）用的小箭头（7×7） -->
    <marker id="arrowSm" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
  </defs>

  <!-- ===== 标题 ===== -->
  <text x="30" y="42" font-size="20" font-weight="bold" fill="#1b5e20">【系统名称】分层架构</text>
  <text x="30" y="66" font-size="12" fill="#616161">数据来源：【来源表/文档】（截至 YYYY-MM-DD）</text>

  <!-- ===== 外部实体（胶囊形） ===== -->
  <rect x="400" y="90" width="400" height="54" rx="27" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
  <text x="600" y="123" font-size="17" font-weight="bold" fill="#37474f" text-anchor="middle">👤 【外部调用方】</text>
  <line x1="600" y1="144" x2="600" y2="178" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== 第一层：接入层 ===== -->
  <rect x="30" y="180" width="1140" height="140" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="46" y="206" font-size="14" font-weight="bold" fill="#0d47a1">🌍 【接入层】</text>
  <g text-anchor="middle">
    <!-- 枢纽节点：橙色，全图不超过 2 处 -->
    <rect x="46" y="224" width="358" height="76" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2.5"/>
    <text x="225" y="255" font-size="15" font-weight="bold" fill="#7f3f00">【枢纽组件】</text>
    <text x="225" y="277" font-size="11.5" fill="#7f3f00">★ 【单点 / 关键说明】</text>

    <rect x="421" y="224" width="358" height="76" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
    <text x="600" y="255" font-size="15" font-weight="bold" fill="#0d2f5c">【接入组件】</text>
    <text x="600" y="277" font-size="11.5" fill="#37474f">【职责 · 约束】</text>

    <rect x="796" y="224" width="358" height="76" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
    <text x="975" y="255" font-size="15" font-weight="bold" fill="#0d2f5c">【接入组件】</text>
    <text x="975" y="277" font-size="11.5" fill="#37474f">【职责 · 约束】</text>
  </g>
  <line x1="600" y1="320" x2="600" y2="354" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== 第二层：业务层 ===== -->
  <rect x="30" y="356" width="1140" height="140" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="46" y="382" font-size="14" font-weight="bold" fill="#1b5e20">📦 【业务层】</text>
  <g text-anchor="middle">
    <rect x="46" y="400" width="358" height="76" rx="6" fill="#a5d6a7" stroke="#1b5e20" stroke-width="2"/>
    <text x="225" y="431" font-size="15" font-weight="bold" fill="#123314">【核心模块】</text>
    <text x="225" y="453" font-size="11.5" fill="#1b5e20">【承载能力 · 量级】</text>

    <rect x="421" y="400" width="358" height="76" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="600" y="431" font-size="15" font-weight="bold" fill="#1b3d1e">【业务模块】</text>
    <text x="600" y="453" font-size="11.5" fill="#37474f">【职责】</text>

    <rect x="796" y="400" width="358" height="76" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="975" y="431" font-size="15" font-weight="bold" fill="#1b3d1e">【业务模块】</text>
    <text x="975" y="453" font-size="11.5" fill="#37474f">【职责】</text>
  </g>
  <line x1="600" y1="496" x2="600" y2="530" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== 第三层：数据层 ===== -->
  <rect x="30" y="532" width="1140" height="140" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="46" y="558" font-size="14" font-weight="bold" fill="#311b92">💾 【数据层】</text>
  <g text-anchor="middle">
    <rect x="46" y="576" width="358" height="76" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
    <text x="225" y="607" font-size="15" font-weight="bold" fill="#311b92">【主存储】</text>
    <text x="225" y="629" font-size="11.5" fill="#37474f">【引擎 · 容量 · 主从】</text>

    <rect x="421" y="576" width="358" height="76" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
    <text x="600" y="607" font-size="15" font-weight="bold" fill="#311b92">【缓存 / 检索】</text>
    <text x="600" y="629" font-size="11.5" fill="#37474f">【用途 · 命中率】</text>

    <!-- 空缺 / 预留：虚线灰框，与图例的"空缺"条目对应 -->
    <rect x="796" y="576" width="358" height="76" rx="6" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="975" y="618" font-size="11.5" fill="#757575">【预留 / 未实现】</text>
  </g>

  <!-- ===== 结论块 ===== -->
  <rect x="30" y="700" width="1140" height="100" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="46" y="730" font-size="15" font-weight="bold" fill="#bf360c">🛰 【核心结论】</text>
  <text x="46" y="756" font-size="11.5" fill="#5d4037">· 【要点一：这张图最想让读者记住的一句话】</text>
  <text x="46" y="780" font-size="11.5" fill="#5d4037">· 【要点二：限制条件或已知风险】</text>

  <!-- ===== 图例（只列图上实际出现的语义，没有的条目删掉） ===== -->
  <rect x="30" y="820" width="1140" height="58" rx="8" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <g font-size="11.5" fill="#37474f">
    <rect x="46" y="832" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
<text font-size="12" x="78" y="842">外部 / 输入侧</text>
    <rect x="326" y="832" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
<text font-size="12" x="358" y="842">主体 / 核心组件</text>
    <rect x="606" y="832" width="22" height="14" rx="3" fill="#a5d6a7" stroke="#1b5e20" stroke-width="2"/>
<text font-size="12" x="638" y="842">主体 · 强调</text>
    <rect x="886" y="832" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="2.5"/>
<text font-size="12" x="918" y="842">枢纽 / 关键节点</text>

    <rect x="46" y="856" width="22" height="14" rx="3" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
<text font-size="12" x="78" y="866">扩展 / 特殊类型</text>
    <rect x="326" y="856" width="22" height="14" rx="3" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="4 3"/>
<text font-size="12" x="358" y="866">空缺 / 未实现</text>
    <line x1="606" y1="863" x2="640" y2="863" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
<text font-size="12" x="648" y="866">一般流向</text>
    <line x1="886" y1="863" x2="920" y2="863" stroke="#1565c0" stroke-width="3" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>
<text font-size="12" x="928" y="866">双向互联（已确认）</text>
  </g>
</svg>
